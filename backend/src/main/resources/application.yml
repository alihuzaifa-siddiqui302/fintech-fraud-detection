# ==============================================================================
# FraudGuard — Base Application Configuration
# Profile-specific settings live in application-dev.yml / application-prod.yml
# Set SPRING_PROFILES_ACTIVE=dev (default) or prod in your environment
# ==============================================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fraudguard-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ----------------------------------------------------------------------------
  # JPA & Hibernate ORM — profile-agnostic settings
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none           # Flyway manages all schema migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
    open-in-view: false

  # ----------------------------------------------------------------------------
  # Flyway Database Migration (V1 → V6)
  # ----------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ------------------------------------------------------------------------------
# FraudGuard Common Domain Properties
# ------------------------------------------------------------------------------
fraudguard:
  velocity:
    window-minutes: 5
    user-limit: 3
    ip-limit: 5
  otp:
    subject: "FraudGuard Security Verification"
    length: 6
  external:
    ipqualityscore:
      base-url: https://www.ipqualityscore.com/api/json/ip
    ipapi:
      base-url: http://ip-api.com/json
      timeout-ms: 3000
      cache-ttl-hours: 24
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta/models
      temperature: 0.3
      max-output-tokens: 2048

# ------------------------------------------------------------------------------
# Actuator Health & Metrics
# ------------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
